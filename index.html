let fetchTimeout = null;
function handleLinkInput(val) {
  state.target = val;
  clearTimeout(fetchTimeout);
  fetchTimeout = setTimeout(() => { fetchDP(val); }, 500);
}

async function fetchDP(inputVal) {
  const url = inputVal.trim();
  if (!url || url.length < 10) {
    state.fetchedAvatar = null;
    state.authorName = null;
    updatePreviewBox();
    return;
  }

  if (url.includes('instagram.com/reel/') || url.includes('instagram.com/p/')) {
    const mediaId = url.split('/reel/')[1]?.split('/')[0] || url.split('/p/')[1]?.split('/')[0];
    if (mediaId) {
      state.fetchedAvatar = `https://instagram.com/p/${mediaId}/media/?size=l`;
      state.authorName = "Reel Content Verified";
    }
  } else {
    const handle = url.replace('@', '').replace('https://instagram.com/', '').split('/')[0].trim();
    state.fetchedAvatar = `https://unavatar.io/instagram/${handle}`;
    state.authorName = `@${handle}`;
  }
  updatePreviewBox();
}

function updatePreviewBox() {
  const container = document.getElementById("dp-preview-wrapper");
  if (!container) return;
  if (state.fetchedAvatar && state.target.trim().length > 5) {
    container.innerHTML = `
      <div class="dp-preview-card">
        <img src="${state.fetchedAvatar}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/174/174855.png'"/>
        <div class="dp-preview-info">
          <h5>${state.authorName || 'Target Verified'}</h5>
          <p>✔ Ready for instant delivery</p>
        </div>
      </div>
    `;
  } else {
    container.innerHTML = "";
  }
}

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const k in attrs||{}) {
    const v = attrs[k];
    if (k === "class") el.className = v;
    else if (k === "html") el.innerHTML = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const c of kids.flat()) {
    if (c == null || c === false) continue;
    el.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  }
  return el;
}

  const footerRights = h("div", {class: "footer-rights"}, "realgrowhub.in - All rights reserved. Support: +91 91462 81080");
  app.appendChild(footerRights);

  updatePreviewBox();
}

async function proceed() {
  if (!state.mobile.trim() || !state.target.trim()) {
    alert("Please enter mobile number and target link.");
    return;
  }
  if (!state.selected) return;
  state.showTerminal = true;
  render();
  
  setTimeout(() => {
    const term = document.getElementById("payment-terminal");
    if (term) term.scrollIntoView({ behavior: "smooth", block: "start" });
  }, 100);
}

render();
</script>
